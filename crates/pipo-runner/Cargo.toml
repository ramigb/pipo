[package]
name = "pipo-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
indexmap = "2.14.2"
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.190"
notify = "8.2.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rquickjs = { version = "0.14.0", features = ["futures", "macro"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
