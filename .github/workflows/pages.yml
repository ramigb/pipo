name: Deploy Pipo website and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "packages/docs/**"
      - "packages/spec/src/**"
      - "packages/cli/src/commands.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      # --ignore-scripts: the docs only need the TypeScript packages, not the Rust runner the postinstall builds.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test the docs
        run: bun test packages/docs

      - name: Build the docs
        run: bun run docs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_ARTIFACT: ${{ runner.temp }}/pipo-site
        run: |
          cp -a site "$SITE_ARTIFACT"
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          page_url = html.escape(base_url, quote=True)
          image_url = html.escape(base_url + "social-card.png", quote=True)
          index = Path(os.environ["SITE_ARTIFACT"]) / "index.html"
          source = index.read_text(encoding="utf-8")
          source = source.replace('content="social-card.png"', f'content="{image_url}"')
          source = source.replace("</head>", f'<link rel="canonical" href="{page_url}">\n'
                                  f'<meta property="og:url" content="{page_url}">\n</head>')
          index.write_text(source, encoding="utf-8")
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pipo-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
